<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0ea5e9"/>
      <stop offset="100%" style="stop-color:#38bdf8"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.05">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="1"/>
    </pattern>
    <rect width="1200" height="630" fill="url(#grid)"/>
  </g>

  <!-- Decorative accent bar -->
  <rect x="0" y="0" width="8" height="630" fill="url(#accentGrad)"/>

  <!-- Logo/Brand -->
  <g transform="translate(80, 80)">
    <text font-family="Inter, system-ui, sans-serif" font-size="24" font-weight="600" fill="#94a3b8">
      TechBlog
    </text>
  </g>

  <!-- Main content area -->
  <g transform="translate(80, 200)">
    <!-- Title placeholder -->
    <text id="title" font-family="Inter, system-ui, sans-serif" font-size="48" font-weight="700" fill="#f8fafc" y="0">
      TechBlog
    </text>

    <!-- Accent line under title -->
    <rect x="0" y="70" width="120" height="4" rx="2" fill="url(#accentGrad)"/>

    <!-- Description -->
    <text font-family="Inter, system-ui, sans-serif" font-size="24" fill="#94a3b8" y="130">
      Dokumentasi & Tutorial Teknis
    </text>

    <!-- Tags -->
    <g transform="translate(0, 180)">
      <rect x="0" y="0" width="120" height="36" rx="6" fill="#0ea5e9" opacity="0.2"/>
      <text x="60" y="24" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="500" fill="#0ea5e9" text-anchor="middle">
        #programming
      </text>

      <rect x="140" y="0" width="120" height="36" rx="6" fill="#0ea5e9" opacity="0.2"/>
      <text x="200" y="24" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="500" fill="#0ea5e9" text-anchor="middle">
        #tutorial
      </text>

      <rect x="280" y="0" width="120" height="36" rx="6" fill="#0ea5e9" opacity="0.2"/>
      <text x="340" y="24" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="500" fill="#0ea5e9" text-anchor="middle">
        #devops
      </text>
    </g>
  </g>

  <!-- Decorative code snippet (bottom right) -->
  <g transform="translate(750, 400)" opacity="0.3">
    <rect x="0" y="0" width="350" height="150" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text font-family="JetBrains Mono, monospace" font-size="12" fill="#64748b">
      <tspan x="16" y="30">npm install</tspan>
      <tspan x="16" y="50">docker-compose up</tspan>
      <tspan x="16" y="70">git push origin</tspan>
      <tspan x="16" y="100" fill="#0ea5e9">▶ Deploy Success</tspan>
    </text>
  </g>

  <!-- URL -->
  <text x="80" y="580" font-family="Inter, system-ui, sans-serif" font-size="18" fill="#64748b">
    blog.rendiputrapradana.workers.dev
  </text>
</svg>
